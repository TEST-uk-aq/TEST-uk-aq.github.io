<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,nofollow,noarchive">
  <title>TEST compressed chart history pilot</title>
  <style>
    body { max-width: 1100px; margin: 2rem auto; padding: 0 1rem; font: 16px/1.5 system-ui, sans-serif; color: #172330; background: #f8fafc; }
    h1 { font-size: 1.6rem; } label { display: inline-grid; gap: .3rem; margin: 0 1rem 1rem 0; }
    select, button { padding: .45rem; font: inherit; } button { cursor: pointer; }
    .station-chart-wrap { position: relative; background: white; border: 1px solid #d6dfe8; border-radius: .4rem; min-height: 420px; }
    svg { width: 100%; height: 420px; } #chart-tooltip { position: absolute; pointer-events: none; }
    pre { max-height: 260px; overflow: auto; padding: 1rem; background: #172330; color: #e5f2fc; font-size: .75rem; }
    #status { min-height: 2rem; } .notice { background: #fff4d6; padding: .65rem; }
  </style>
</head>
<body>
  <h1>TEST compressed chart history pilot</h1>
  <p class="notice">Authorised AURN PM2.5 timeseries 212, station 248 only. Historical September 2026. This isolated viewer is experimental; PM AQI may be partial where earlier context is unpublished.</p>
  <label>Data source
    <select id="source">
      <option value="normal-day">Normal TEST v3 — 1 September</option>
      <option value="json-v3-day">Compressed JSON v3 — 1 September</option>
      <option value="json-v2-day">Compressed JSON retained v2 — 1 September</option>
      <option value="normal-month">Normal TEST v3 — September</option>
      <option value="json-v3-month">Compressed JSON v3 — September</option>
    </select>
  </label>
  <button id="load" type="button">Load chart</button>
  <button id="download" type="button">Download diagnostics</button>
  <p id="status" role="status"></p>
  <div class="station-chart-wrap" id="chart-wrap"><svg id="chart" role="img" aria-label="PM2.5 history chart"></svg><div id="chart-tooltip"></div></div>
  <h2>Diagnostics</h2>
  <pre id="diagnostics"></pre>
  <script src="https://cdn.jsdelivr.net/npm/d3@7.9.0/dist/d3.min.js" crossorigin="anonymous"></script>
  <script src="/chart-core.js"></script>
  <script src="/shared/auth/uk-aq-cache-auth.js"></script>
  <script type="module" src="./viewer.js"></script>
</body>
</html>
